# Change the prefix from Ctrl+b to Ctrl+a
set -g prefix C-o
unbind C-b
bind C-o send-prefix

# Enable mouse support for switching panes and resizing
set -g mouse on
# Enable title
set -g set-titles on
set -g set-titles-string '#{pane_title}'
# Switch panes using Vim directional keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# New windows and panes from current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Start window and pane numbering at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
# Use vim keybindings in copy mode
setw -g mode-keys vi
set -g default-shell /usr/bin/zsh
set -g default-terminal "foot"   

set-option -s focus-events on
set-option -s extended-keys on
set-option -s escape-time 0
#=============================
# Styles
#=============================
HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
BG="#434d5f"
FG="#b5bbc5"
ACTIVE_WINDOW_BG="#89d0c0"
ACTIVE_WINDOW_FG="#3a4353"
set-option -g status-style bg=${BG},fg=${FG}
set-option -g status-justify absolute-centre
set-option -g window-status-current-format "\
#[fg=${ACTIVE_WINDOW_BG}]${HALF_ROUND_OPEN}\
#[bg=${ACTIVE_WINDOW_BG},nounderscore,fg=${ACTIVE_WINDOW_FG}]#I\
#[fg=${GREEN}]:\
#[fg=${ACTIVE_WINDOW_FG},nounderscore]#W\
#[fg=${ACTIVE_WINDOW_BG},bg=${BG}]${HALF_ROUND_CLOSE}\
"

set-option -g status-right "#h"
# Update copy-pipe to use wl-copy for Wayland clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
