# Change the prefix from Ctrl+b to Ctrl+a
set -g prefix C-o
unbind C-b
bind C-o send-prefix

# Enable mouse support for switching panes and resizing
set -g mouse on
# Enable title
set -g set-titles-string '#{pane_title}'
# Switch panes using Vim directional keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start window and pane numbering at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
# Use vim keybindings in copy mode
setw -g mode-keys vi

# Update copy-pipe to use wl-copy for Wayland clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
