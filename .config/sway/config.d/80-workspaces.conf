#
# Workspaces:
#
    set $ws1 "ws1"
    set $ws2 "ws2"
    set $ws3 "ws3"
    set $ws4 "ws4"
    set $ws5 "ws5"
    set $ws6 "ws6"
    set $ws7 "ws7"
    set $ws8 "ws8"
    set $ws9 "ws9"
    set $ws10 "ws10"
    # Switch to workspace
    bindsym $mod+1 workspace $ws1
    bindsym $mod+2 workspace $ws2
    bindsym $mod+3 workspace $ws3
    bindsym $mod+4 workspace $ws4
    bindsym $mod+5 workspace $ws5
    bindsym $mod+6 workspace $ws6
    bindsym $mod+7 workspace $ws7
    bindsym $mod+8 workspace $ws8
    bindsym $mod+9 workspace $ws9
    bindsym $mod+0 workspace $ws10
    # Move focused container to workspace
    bindsym $mod+Shift+1 move container to workspace $ws1 
    bindsym $mod+Shift+2 move container to workspace $ws2
    bindsym $mod+Shift+3 move container to workspace $ws3
    bindsym $mod+Shift+4 move container to workspace $ws4
    bindsym $mod+Shift+5 move container to workspace $ws5
    bindsym $mod+Shift+6 move container to workspace $ws6 
    bindsym $mod+Shift+7 move container to workspace $ws7 
    bindsym $mod+Shift+8 move container to workspace $ws8 
    bindsym $mod+Shift+9 move container to workspace $ws9 
    bindsym $mod+Shift+0 move container to workspace $ws10 

    bindsym $mod+Ctrl+Alt+1 move workspace $ws1 to output current
    bindsym $mod+Ctrl+Alt+2 move workspace $ws2 to output current
    bindsym $mod+Ctrl+Alt+3 move workspace $ws3 to output current
    bindsym $mod+Ctrl+Alt+4 move workspace $ws4 to output current
    bindsym $mod+Ctrl+Alt+5 move workspace $ws5 to output current
    bindsym $mod+Ctrl+Alt+6 move workspace $ws6 to output current
    bindsym $mod+Ctrl+Alt+7 move workspace $ws7 to output current
    bindsym $mod+Ctrl+Alt+8 move workspace $ws8 to output current
    bindsym $mod+Ctrl+Alt+9 move workspace $ws9 to output current
    bindsym $mod+Ctrl+Alt+0 move workspace $ws10 to output current
    # Note: workspaces can have any name you want, not just numbers.
    # We just use 1-10 as the default.
    assign [class="dude.exe"] workspace $ws4
    assign [class="WinBox"] workspace $ws4
    assign [app_id="libreoffice*"] workspace $ws6
